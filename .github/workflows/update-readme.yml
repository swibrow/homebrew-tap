name: Update README

on:
  push:
    branches: [main]
    paths:
      - "Formula/*.rb"
      - "Casks/*.rb"

jobs:
  update-readme:
    runs-on: homebrew-tap
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Generate README
        run: |
          cat > README.md << 'HEADER'
          # homebrew-tap

          Homebrew tap for [swibrow](https://github.com/swibrow) CLI tools.

          ## Usage

          ```sh
          brew tap swibrow/tap
          ```

          ## Available Packages

          | Package | Type | Description | Version | Install |
          |---------|------|-------------|---------|---------|
          HEADER

          # field <file> <stanza> — first value of a `stanza "value"` line
          field() {
            grep "^[[:space:]]*$2 " "$1" | head -1 | sed "s/.*$2 \"\([^\"]*\)\".*/\1/"
          }

          for formula in Formula/*.rb; do
            [ -e "$formula" ] || continue
            # Handle CamelCase class names (e.g., AgentOps -> agent-ops)
            name=$(grep 'class .* < Formula' "$formula" | sed 's/class \(.*\) < Formula/\1/' | sed 's/\([a-z]\)\([A-Z]\)/\1-\2/g' | tr '[:upper:]' '[:lower:]')
            echo "| [${name}]($(field "$formula" homepage)) | formula | $(field "$formula" desc) | $(field "$formula" version) | \`brew install swibrow/tap/${name}\` |" >> README.md
          done

          for cask in Casks/*.rb; do
            [ -e "$cask" ] || continue
            name=$(grep '^cask ' "$cask" | head -1 | sed 's/cask "\([^"]*\)".*/\1/')
            echo "| [${name}]($(field "$cask" homepage)) | cask | $(field "$cask" desc) | $(field "$cask" version) | \`brew install --cask swibrow/tap/${name}\` |" >> README.md
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (git add README.md && git commit -m "Update README with latest packages" && git push)
